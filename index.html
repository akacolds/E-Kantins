<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kantin Sekolah</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- USER SESSION BAR -->
    <header id="user-session-bar" class="session-bar hidden">
        <span id="session-user-text">Selamat Datang</span>
        <button class="btn btn-sm btn-logout" onclick="logout()">Keluar</button>
    </header>

    <div class="container">

        <!-- ================= VIEW 1: LOGIN ================= -->
        <section id="view-login" class="card auth-card">
            <h2>E-Kantin Sekolah</h2>
            <p class="subtitle">Pesan makanan tanpa antre panjang</p>

            <div class="tab-login">
                <button id="tab-btn-murid" class="btn-tab active" onclick="gantiTabLogin('murid')">🎓 Murid</button>
                <button id="tab-btn-kantin" class="btn-tab" onclick="gantiTabLogin('kantin')">🏪 Penjual Kantin</button>
            </div>

            <!-- Form Murid -->
            <form id="form-login-murid" onsubmit="loginMurid(event)">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="input-nama-murid" placeholder="Contoh: Zul javanese" required>
                </div>
                <div class="form-group">
                    <label>Kelas</label>
                    <input type="text" id="input-kelas-murid" placeholder="Contoh: XII RPL B" required>
                </div>
                <div class="form-group">
                    <label>Kode Unik (4 Angka Bebas)</label>
                    <input type="password" id="input-kode-murid" maxlength="4" placeholder="Contoh: 1234" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Masuk Sebagai Murid</button>
            </form>

            <!-- Form Kantin -->
            <form id="form-login-kantin" class="hidden" onsubmit="loginKantin(event)">
                <div class="form-group">
                    <label>Pilih Stand Kantin</label>
                    <select id="select-kantin-login">
                        <option value="1">Kantin 1 </option>
                        <option value="2">Kantin 2 </option>
                        <option value="3">Kantin 3 </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password Kantin</label>
                    <input type="password" id="input-pass-kantin" placeholder="Masukkan Password Stand" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Masuk Sebagai Penjual</button>
            </form>
        </section>


        <!-- ================= VIEW 2: DASHBOARD MURID ================= -->
        <section id="view-pembeli" class="hidden">
            <nav class="sub-nav">
                <button id="btn-tab-pembeli-menu" class="btn-subnav active" onclick="switchPembeliView('menu')">🍕 Katalog Menu</button>
                <button id="btn-tab-pembeli-pesanan" class="btn-subnav" onclick="switchPembeliView('pesanan')">🛍️ Pesanan Saya</button>
            </nav>

            <!-- Tab Katalog Menu -->
            <div id="pembeli-view-menu">
                <div class="filter-bar">
                    <label>Filter Kantin:</label>
                    <select id="filter-kantin" onchange="renderKatalogPembeli()">
                        <option value="all">Semua Stand Kantin</option>
                        <option value="1">Kantin 1</option>
                        <option value="2">Kantin 2</option>
                        <option value="3">Kantin 3</option>
                    </select>
                </div>
                <div id="grid-menu-pembeli" class="grid-container"></div>
            </div>

            <!-- Tab Pesanan Saya -->
            <div id="pembeli-view-pesanan" class="hidden">
                <h3>Status & Riwayat Pesanan</h3>
                <div id="list-pesanan-pembeli" class="order-list"></div>
            </div>
        </section>


        <!-- ================= VIEW 3: DASHBOARD PENJUAL KANTIN ================= -->
        <section id="view-kantin" class="hidden">
            <nav class="sub-nav">
                <button id="btn-tab-kantin-pesanan" class="btn-subnav active" onclick="switchKantinView('pesanan')">
                    📦 Pesanan Masuk <span id="badge-pesanan-kantin" class="badge-count hidden">0</span>
                </button>
                <button id="btn-tab-kantin-menu" class="btn-subnav" onclick="switchKantinView('menu')">🍔 Kelola Menu</button>
                <button id="btn-tab-kantin-selesai" class="btn-subnav" onclick="switchKantinView('selesai')">✅ Riwayat Selesai</button>
            </nav>

            <!-- Tab Pesanan Masuk -->
            <div id="kantin-view-pesanan">
                <h3 id="label-kantin-pesanan">Pesanan Masuk</h3>
                <div id="list-pesanan-masuk" class="order-list"></div>
            </div>

            <!-- Tab Kelola Menu -->
            <div id="kantin-view-menu" class="hidden">
                <div class="action-header">
                    <h3 id="label-kantin-menu">Kelola Menu & Stok</h3>
                    <button class="btn btn-primary" onclick="bukaModalTambahMenu()">+ Tambah Menu Baru</button>
                </div>
                <div id="grid-menu-kantin" class="grid-container"></div>
            </div>

            <!-- Tab Pesanan Selesai -->
            <div id="kantin-view-selesai" class="hidden">
                <h3>Riwayat Pesanan Selesai (> 1 Menit)</h3>
                <div id="list-pesanan-selesai" class="order-list"></div>
            </div>
        </section>

    </div>


    <!-- ================= MODAL PESAN ITEM (MURID) ================= -->
    <div id="modal-pesan" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modal-nama-menu">Pesan Menu</h3>
            <p id="modal-kantin-menu" class="subtitle"></p>
            
            <div class="form-group">
                <label>Pilih Varian</label>
                <select id="select-varian-item"></select>
            </div>

            <div class="form-group">
                <label>Jumlah Porsi</label>
                <input type="number" id="input-jumlah-porsi" value="1" min="1" onchange="updateTotalHargaPesan()">
            </div>

            <div class="form-group">
                <label>Catatan Tambahan (Opsional)</label>
                <input type="text" id="input-catatan-pesan" placeholder="Misal: Tanpa pedas, saus dipisah">
            </div>

            <div class="modal-price-tag">
                <span id="modal-harga-menu">Total: Rp 0</span>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="tutupModalPesan()">Batal</button>
                <button class="btn btn-primary" onclick="konfirmasiKirimPesanan()">Kirim Pesanan</button>
            </div>
        </div>
    </div>


    <!-- ================= MODAL TAMBAH MENU (KANTIN) ================= -->
    <div id="modal-tambah-menu" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Tambah Menu Baru</h3>
            <form onsubmit="simpanMenuBaru(event)">
                <div class="form-group">
                    <label>Nama Makanan / Minuman</label>
                    <input type="text" id="new-menu-nama" required placeholder="Contoh: Ayam Geprek">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="new-menu-kategori">
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Camilan">Camilan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Varian (Pisahkan dengan koma)</label>
                    <input type="text" id="new-menu-varian" placeholder="Contoh: Original, Pedas, Extra KeSub">
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="new-menu-harga" required placeholder="10000">
                </div>
                <div class="form-group">
                    <label>Stok Awal</label>
                    <input type="number" id="new-menu-stok" required placeholder="20">
                </div>
                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <textarea id="new-menu-desc" rows="2" placeholder="Penjelasan singkat menu..."></textarea>
                </div>
                <div class="form-group">
                    <label>URL Link Foto Gambar</label>
                    <input type="url" id="new-menu-foto-link" placeholder="https://images.unsplash.com/...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="tutupModalTambahMenu()">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Menu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ELEMEN AUDIO NOTIFIKASI -->
    <audio id="sound-notif" src="notif.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
